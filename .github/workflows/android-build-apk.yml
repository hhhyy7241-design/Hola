name: Build & Sign Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: 'on-failure'
          add-job-summary-as-pr-comment: 'never'

      - name: Ensure Local Environment Files
        run: |
          touch .env
          touch .env.example

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew || true

      - name: Generate Release Keystore if needed
        run: |
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=ChatPro, OU=Mobile, O=ChatPro, L=Cienfuegos, S=Cienfuegos, C=CU"
          fi

      - name: Compile and Assemble Release APK
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEY_ALIAS: upload
          KEYSTORE_PATH: my-upload-key.jks
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -Dkotlin.compiler.execution.strategy=daemon \
            -Dksp.incremental=false \
            -Dksp.incremental.intermodule=false \
            --stacktrace

      - name: Verify APK Generated
        run: |
          echo "Checking generated APKs in app/build/outputs/apk/release/:"
          ls -la app/build/outputs/apk/release/
          APK_COUNT=$(find app/build/outputs/apk/release/ -maxdepth 1 -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK file found in app/build/outputs/apk/release/"
            exit 1
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
